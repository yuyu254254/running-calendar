<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跑步日历</title>
<style>
:root{
  --bg:#eef0f4;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#16a34a;
  --accent-dark:#15803d;
  --accent-light:#e6f7ee;
  --accent2:#f97316;
  --today:#2563eb;
  --border:#e5e7eb;
  --danger:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 18% 0%, rgba(22,163,74,0.08), transparent 30%),
    radial-gradient(circle at 88% 8%, rgba(249,115,22,0.08), transparent 30%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
}
button{font-family:inherit}
.container{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:relative;padding-bottom:14px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:34px}
.brand h1{margin:0;font-size:22px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}
.actions button{
  border:1px solid var(--border);background:#fff;color:var(--text);
  padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);transition:.15s;
}
.actions button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 6px 16px rgba(22,163,74,.12);transform:translateY(-1px)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px 16px;box-shadow:0 2px 10px rgba(15,23,42,.04);position:relative;overflow:hidden;transition:.15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.08)}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stat-card .label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
.stat-icon{font-size:15px}
.stat-card strong{display:inline-block;font-size:26px;margin-top:6px;font-weight:700}
.stat-card small{color:var(--muted);font-size:13px;margin-left:3px}
.stat-card.cumulative strong{font-size:18px}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.toolbar h2{margin:0;font-size:20px;min-width:120px}
.toolbar button{
  border:1px solid var(--border);background:#fff;color:var(--text);
  padding:8px 16px;border-radius:999px;cursor:pointer;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:.15s;
}
.toolbar button:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 6px 16px rgba(22,163,74,.12);transform:translateY(-1px)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:8px}
.weekdays span{text-align:center;color:var(--muted);font-size:13px;padding:4px 0}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}

.calendar-day{
  min-height:96px;border:1px solid var(--border);background:#fff;border-radius:12px;
  padding:8px;text-align:left;cursor:pointer;transition:.15s;color:var(--text);position:relative;
}
.calendar-day:hover{border-color:var(--accent);transform:translateY(-1px)}
.calendar-day.other-month{background:#fafbfc;color:#c2c8d0}
.calendar-day.weekend:not(.other-month):not(.has-record){background:#fffbf2;border-color:#fde8c8}
.calendar-day.has-record{background:var(--accent-light);border-color:#cdeedb}
.calendar-day.has-record::after{content:"";position:absolute;left:10px;bottom:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.calendar-day.today{background:linear-gradient(180deg,#eef5ff,#f8fbff);border-color:var(--today);box-shadow:0 0 0 1px var(--today) inset}
.calendar-day.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.day-num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:600}
.today .day-num{background:linear-gradient(135deg,var(--today),#60a5fa);color:#fff;box-shadow:0 4px 10px rgba(37,99,235,.28)}
.day-summary{display:block;margin-top:12px;font-size:12px;line-height:1.5;color:var(--accent-dark)}
.other-month .day-summary{color:#b7c4cf}

.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none}
.overlay.open{display:flex}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);
  background:#fff;z-index:41;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .2s ease;box-shadow:-12px 0 30px rgba(0,0,0,.12);
}
.overlay.open .panel{transform:translateX(0)}
.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.panel-head h3{margin:0;font-size:18px}
.panel-head p{margin:6px 0 0;color:var(--muted);font-size:13px}
.close-btn{border:none;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.close-btn:hover{color:var(--text)}
.record-list{flex:1;overflow-y:auto;padding:16px 20px}
.record-item{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.record-item .main{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.record-item .nums{font-size:15px;font-weight:600}
.record-item .meta{color:var(--muted);font-size:13px;margin-top:4px}
.record-item .note{color:var(--muted);font-size:13px;margin-top:6px;font-style:italic}
.record-item .ops{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
.record-item .ops button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}
.record-item .ops button:hover{color:var(--accent)}
.record-item .ops button.delete:hover{color:var(--danger)}
.empty{padding:50px 0;text-align:center;color:var(--muted);font-size:14px}
.add-btn{
  margin:0 20px 20px;padding:14px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(22,163,74,.22);transition:.15s;
}
.add-btn:hover{box-shadow:0 12px 26px rgba(22,163,74,.28);transform:translateY(-1px)}

.modal-overlay{z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;width:min(440px,100%);max-height:92vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{margin:0;font-size:17px}
form{padding:16px 20px 20px}
form label{display:block;margin-bottom:14px;font-size:13px;color:var(--muted)}
form input[type=date],form input[type=number],form input[type=text]{
  width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:15px;color:var(--text);
}
form input:focus{outline:2px solid #bfe8cf;border-color:var(--accent)}
.pace-preview{margin:-2px 0 14px;padding:10px 12px;background:var(--accent-light);border-radius:10px;font-size:14px;color:var(--accent-dark)}
.form-actions{display:flex;justify-content:flex-end;gap:8px}
.form-actions button{border:1px solid var(--border);background:#fff;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:14px}
.form-actions .primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border:none;color:#fff;font-weight:600;box-shadow:0 8px 18px rgba(22,163,74,.18)}
.form-actions .primary:hover{box-shadow:0 10px 22px rgba(22,163,74,.24)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:rgba(17,24,39,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:.2s;
}
.toast.show{opacity:1}

@media (max-width:640px){
  .container{padding:14px 10px 40px}
  .brand h1{font-size:19px}
  .stat-card strong{font-size:22px}
  .calendar-grid{gap:4px}
  .weekdays{gap:4px}
  .calendar-day{min-height:66px;padding:5px;border-radius:9px}
  .day-num{min-width:20px;height:20px;font-size:12px}
  .day-summary{margin-top:6px;font-size:11px}
  .panel{width:100%;height:85vh;top:auto;bottom:0;transform:translateY(100%);border-radius:16px 16px 0 0}
  .overlay.open .panel{transform:translateY(0)}
}
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏃</span>
      <div>
        <h1>跑步日历</h1>
        <p id="subtitle">记录每一次跑步</p>
      </div>
    </div>
    <div class="actions">
      <button id="exportBtn" type="button">导出</button>
      <button id="importBtn" type="button">导入</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <section class="stats">
    <div class="stat-card"><div class="label"><span class="stat-icon">🏃</span>本月次数</div><strong id="monthCount">0</strong><small>次</small></div>
    <div class="stat-card"><div class="label"><span class="stat-icon">📏</span>本月距离</div><strong id="monthDistance">0.0</strong><small>km</small></div>
    <div class="stat-card"><div class="label"><span class="stat-icon">⏱️</span>本月时长</div><strong id="monthDuration">0分</strong></div>
    <div class="stat-card"><div class="label"><span class="stat-icon">⚡</span>平均配速</div><strong id="monthPace">—</strong></div>
    <div class="stat-card cumulative"><div class="label"><span class="stat-icon">🏆</span>累计</div><strong id="totalCount">0</strong><small>次</small> · <strong id="totalDistance">0.0</strong><small>km</small></div>
  </section>

  <section class="toolbar">
    <button id="prevBtn" type="button">◀ 上一月</button>
    <button id="todayBtn" type="button">回到今天</button>
    <h2 id="monthLabel"></h2>
    <button id="nextBtn" type="button">下一月 ▶</button>
  </section>

  <div class="weekdays">
    <span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span>
  </div>
  <div id="calendarGrid" class="calendar-grid"></div>
  <p class="hint">点击日期查看或添加跑步记录 · 左右方向键切换月份，T 回到今天</p>
</div>

<div id="panelOverlay" class="overlay">
  <aside class="panel">
    <div class="panel-head">
      <div>
        <h3 id="panelDate"></h3>
        <p id="panelSummary"></p>
      </div>
      <button class="close-btn" id="closePanel" type="button" aria-label="关闭">×</button>
    </div>
    <div id="recordList" class="record-list"></div>
    <button id="addRecordBtn" class="add-btn" type="button">+ 新增跑步</button>
  </aside>
</div>

<div id="modalOverlay" class="overlay modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">新增跑步</h3>
      <button class="close-btn" id="closeModal" type="button" aria-label="关闭">×</button>
    </div>
    <form id="recordForm">
      <input type="hidden" id="recordId">
      <label>日期
        <input type="date" id="fieldDate" required>
      </label>
      <label>距离（公里）
        <input type="number" id="fieldDistance" step="0.01" min="0.01" placeholder="例如 5" required>
      </label>
      <label>时长（分钟）
        <input type="number" id="fieldDuration" step="1" min="1" placeholder="例如 30" required>
      </label>
      <label>备注（可选）
        <input type="text" id="fieldNote" maxlength="200" placeholder="例如 轻松跑、夜跑">
      </label>
      <div class="pace-preview" id="pacePreview">输入距离和时长后显示配速</div>
      <div class="form-actions">
        <button type="button" id="cancelSave">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  const STORAGE_KEY = 'runningCalendar.records.v1';
  const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];

  const grid = document.getElementById('calendarGrid');
  const monthLabel = document.getElementById('monthLabel');
  const subtitle = document.getElementById('subtitle');
  const panelOverlay = document.getElementById('panelOverlay');
  const panelDate = document.getElementById('panelDate');
  const panelSummary = document.getElementById('panelSummary');
  const recordList = document.getElementById('recordList');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const recordForm = document.getElementById('recordForm');
  const recordIdInput = document.getElementById('recordId');
  const fieldDate = document.getElementById('fieldDate');
  const fieldDistance = document.getElementById('fieldDistance');
  const fieldDuration = document.getElementById('fieldDuration');
  const fieldNote = document.getElementById('fieldNote');
  const pacePreview = document.getElementById('pacePreview');
  const toast = document.getElementById('toast');

  const monthCount = document.getElementById('monthCount');
  const monthDistance = document.getElementById('monthDistance');
  const monthDuration = document.getElementById('monthDuration');
  const monthPace = document.getElementById('monthPace');
  const totalCount = document.getElementById('totalCount');
  const totalDistance = document.getElementById('totalDistance');

  const importFile = document.getElementById('importFile');

  let records = loadRecords();
  let editingId = null;
  let toastTimer = null;
  const now = new Date();
  let view = { year: now.getFullYear(), month: now.getMonth() };
  let selectedDate = toKey(now);

  function makeId(){
    return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function toKey(date){
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2,'0');
    const d = String(date.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + d;
  }

  function dateFromKey(key){
    const parts = key.split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function loadRecords(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed)) return [];
      return parsed.map(normalizeRecord).filter(isValidRecord);
    }catch(e){
      return [];
    }
  }

  function saveRecords(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    }catch(e){
      showToast('保存失败：浏览器可能不允许本地存储');
    }
  }

  function normalizeRecord(r){
    const obj = r || {};
    return {
      id: typeof obj.id === 'string' && obj.id ? obj.id : makeId(),
      date: typeof obj.date === 'string' ? obj.date : '',
      distanceKm: Number(obj.distanceKm),
      durationMin: Number(obj.durationMin),
      note: typeof obj.note === 'string' ? obj.note : ''
    };
  }

  function isValidRecord(r){
    return /^\d{4}-\d{2}-\d{2}$/.test(r.date) && isFinite(r.distanceKm) && r.distanceKm > 0 && isFinite(r.durationMin) && r.durationMin > 0;
  }

  function formatKm(value){
    return (Math.round(value * 10) / 10).toFixed(1);
  }

  function formatDuration(min){
    min = Math.round(min);
    if(min < 60) return min + '分';
    const h = Math.floor(min / 60);
    const m = min % 60;
    return m === 0 ? h + '小时' : h + '小时' + m + '分';
  }

  function formatPace(minPerKm){
    if(!isFinite(minPerKm) || minPerKm <= 0) return '—';
    let totalSec = Math.round(minPerKm * 60);
    let mm = Math.floor(totalSec / 60);
    let ss = totalSec % 60;
    if(ss === 60){ mm += 1; ss = 0; }
    return mm + "'" + String(ss).padStart(2,'0') + '"';
  }

  function escapeHtml(value){
    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function monthPrefix(){
    return view.year + '-' + String(view.month + 1).padStart(2,'0');
  }

  function recordsForDate(key){
    return records.filter(r => r.date === key);
  }

  function recordsForMonth(){
    const prefix = monthPrefix();
    return records.filter(r => r.date.startsWith(prefix));
  }

  function renderStats(){
    const monthRecords = recordsForMonth();
    const count = monthRecords.length;
    const distance = monthRecords.reduce((s,r) => s + r.distanceKm, 0);
    const duration = monthRecords.reduce((s,r) => s + r.durationMin, 0);
    const pace = distance > 0 ? duration / distance : null;

    monthCount.textContent = count;
    monthDistance.textContent = formatKm(distance);
    monthDuration.textContent = formatDuration(duration);
    monthPace.textContent = pace === null ? '—' : formatPace(pace);

    totalCount.textContent = records.length;
    totalDistance.textContent = formatKm(records.reduce((s,r) => s + r.distanceKm, 0));
  }

  function renderCalendar(){
    monthLabel.textContent = view.year + '年' + (view.month + 1) + '月';
    subtitle.textContent = '记录每一次跑步 · 本月 ' + recordsForMonth().length + ' 次';

    const first = new Date(view.year, view.month, 1);
    const offset = (first.getDay() + 6) % 7;
    const start = new Date(view.year, view.month, 1 - offset);
    const todayKey = toKey(new Date());
    let html = '';

    for(let i = 0; i < 42; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const key = toKey(d);
      const inMonth = d.getMonth() === view.month;
      const dayRecords = recordsForDate(key);
      const classes = ['calendar-day'];
      if(!inMonth) classes.push('other-month');
      if(dayRecords.length > 0) classes.push('has-record');
      if(inMonth && (d.getDay() === 0 || d.getDay() === 6)) classes.push('weekend');
      if(key === todayKey) classes.push('today');
      if(key === selectedDate && inMonth) classes.push('selected');

      let summary = '';
      if(dayRecords.length > 0){
        const dist = dayRecords.reduce((s,r) => s + r.distanceKm, 0);
        const dur = dayRecords.reduce((s,r) => s + r.durationMin, 0);
        summary = dayRecords.length + '次 · ' + formatKm(dist) + ' km · ' + formatDuration(dur);
      }

      html += '<button type="button" class="' + classes.join(' ') + '" data-key="' + key + '">'
        + '<span class="day-num">' + d.getDate() + '</span>'
        + (summary ? '<span class="day-summary">' + escapeHtml(summary) + '</span>' : '')
        + '</button>';
    }
    grid.innerHTML = html;
    renderStats();
  }

  function renderPanel(){
    const date = dateFromKey(selectedDate);
    const dayRecords = recordsForDate(selectedDate);
    const dist = dayRecords.reduce((s,r) => s + r.distanceKm, 0);
    const dur = dayRecords.reduce((s,r) => s + r.durationMin, 0);
    panelDate.textContent = date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + WEEKDAYS[date.getDay()];
    panelSummary.textContent = dayRecords.length
      ? '当天合计 ' + dayRecords.length + ' 次 · ' + formatKm(dist) + ' km · ' + formatDuration(dur)
      : '这一天还没有跑步记录';

    if(dayRecords.length === 0){
      recordList.innerHTML = '<div class="empty">点击下方按钮，记录今天的第一次跑步 💪</div>';
      return;
    }

    let html = '';
    dayRecords.forEach(r => {
      const pace = formatPace(r.durationMin / r.distanceKm);
      html += '<div class="record-item" data-id="' + escapeHtml(r.id) + '">'
        + '<div class="main"><div class="nums">' + formatKm(r.distanceKm) + ' km · ' + formatDuration(r.durationMin) + '</div></div>'
        + '<div class="meta">配速 ' + pace + ' / 公里</div>'
        + (r.note ? '<div class="note">' + escapeHtml(r.note) + '</div>' : '')
        + '<div class="ops">'
        + '<button type="button" data-action="edit" data-id="' + escapeHtml(r.id) + '">编辑</button>'
        + '<button type="button" class="delete" data-action="delete" data-id="' + escapeHtml(r.id) + '">删除</button>'
        + '</div></div>';
    });
    recordList.innerHTML = html;
  }

  function openPanel(key){
    selectedDate = key;
    renderCalendar();
    renderPanel();
    panelOverlay.classList.add('open');
  }

  function closePanel(){
    panelOverlay.classList.remove('open');
  }

  function openModal(id){
    editingId = id || null;
    if(id){
      const r = records.find(x => x.id === id);
      if(!r) return;
      recordIdInput.value = r.id;
      fieldDate.value = r.date;
      fieldDistance.value = r.distanceKm;
      fieldDuration.value = r.durationMin;
      fieldNote.value = r.note;
      modalTitle.textContent = '编辑跑步';
    }else{
      recordIdInput.value = '';
      fieldDate.value = selectedDate;
      fieldDistance.value = '';
      fieldDuration.value = '';
      fieldNote.value = '';
      modalTitle.textContent = '新增跑步';
    }
    updatePacePreview();
    modalOverlay.classList.add('open');
    setTimeout(() => fieldDistance.focus(), 50);
  }

  function closeModal(){
    modalOverlay.classList.remove('open');
    editingId = null;
  }

  function updatePacePreview(){
    const d = parseFloat(fieldDistance.value);
    const m = parseFloat(fieldDuration.value);
    if(isFinite(d) && d > 0 && isFinite(m) && m > 0){
      pacePreview.textContent = '配速：' + formatPace(m / d) + ' / 公里';
    }else{
      pacePreview.textContent = '输入距离和时长后显示配速';
    }
  }

  function changeMonth(delta){
    view = { year: view.year, month: view.month + delta };
    const normalized = new Date(view.year, view.month, 1);
    view.year = normalized.getFullYear();
    view.month = normalized.getMonth();
    selectedDate = toKey(normalized);
    renderCalendar();
  }

  function goToday(){
    const today = new Date();
    view = { year: today.getFullYear(), month: today.getMonth() };
    selectedDate = toKey(today);
    renderCalendar();
  }

  function exportData(){
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '跑步日历-' + toKey(new Date()) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已导出 ' + records.length + ' 条记录');
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const parsed = JSON.parse(reader.result);
        if(!Array.isArray(parsed)) throw new Error('格式不正确');
        const cleaned = parsed.map(normalizeRecord).filter(isValidRecord);
        if(cleaned.length === 0 && parsed.length > 0){
          showToast('导入失败：没有找到有效记录');
          return;
        }
        const ok = confirm('导入将替换当前 ' + records.length + ' 条记录为导入的 ' + cleaned.length + ' 条记录，确定吗？');
        if(!ok) return;
        records = cleaned;
        saveRecords();
        renderCalendar();
        showToast('导入成功，共 ' + cleaned.length + ' 条记录');
      }catch(e){
        showToast('导入失败：文件不是有效的 JSON');
      }
    };
    reader.readAsText(file);
  }

  grid.addEventListener('click', function(e){
    const cell = e.target.closest('.calendar-day');
    if(!cell) return;
    const d = dateFromKey(cell.dataset.key);
    if(d.getMonth() !== view.month || d.getFullYear() !== view.year){
      view = { year: d.getFullYear(), month: d.getMonth() };
      selectedDate = cell.dataset.key;
      renderCalendar();
    }
    openPanel(cell.dataset.key);
  });

  recordList.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = btn.dataset.id;
    if(btn.dataset.action === 'edit'){
      openModal(id);
    }else if(btn.dataset.action === 'delete'){
      const r = records.find(x => x.id === id);
      if(!r) return;
      if(!confirm('确定删除这条跑步记录吗？')) return;
      records = records.filter(x => x.id !== id);
      saveRecords();
      renderCalendar();
      renderPanel();
      showToast('已删除');
    }
  });

  document.getElementById('prevBtn').addEventListener('click', () => changeMonth(-1));
  document.getElementById('nextBtn').addEventListener('click', () => changeMonth(1));
  document.getElementById('todayBtn').addEventListener('click', goToday);
  document.getElementById('closePanel').addEventListener('click', closePanel);
  document.getElementById('addRecordBtn').addEventListener('click', () => openModal(null));
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelSave').addEventListener('click', closeModal);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', function(){
    if(importFile.files && importFile.files[0]){
      importData(importFile.files[0]);
    }
    importFile.value = '';
  });

  panelOverlay.addEventListener('click', function(e){
    if(e.target === panelOverlay) closePanel();
  });
  modalOverlay.addEventListener('click', function(e){
    if(e.target === modalOverlay) closeModal();
  });

  fieldDistance.addEventListener('input', updatePacePreview);
  fieldDuration.addEventListener('input', updatePacePreview);

  recordForm.addEventListener('submit', function(e){
    e.preventDefault();
    const date = fieldDate.value;
    const distance = parseFloat(fieldDistance.value);
    const duration = parseFloat(fieldDuration.value);
    const note = fieldNote.value.trim();

    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){
      showToast('请选择有效日期');
      return;
    }
    if(!isFinite(distance) || distance <= 0){
      showToast('距离必须大于 0');
      return;
    }
    if(!isFinite(duration) || duration <= 0){
      showToast('时长必须大于 0');
      return;
    }

    if(editingId){
      records = records.map(r => r.id === editingId
        ? { id: editingId, date, distanceKm: distance, durationMin: duration, note }
        : r);
    }else{
      records.push({ id: makeId(), date, distanceKm: distance, durationMin: duration, note });
    }

    saveRecords();
    selectedDate = date;
    renderCalendar();
    if(panelOverlay.classList.contains('open')) renderPanel();
    const wasEdit = !!editingId;
    closeModal();
    showToast(wasEdit ? '已更新' : '已保存');
  });

  document.addEventListener('keydown', function(e){
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if(modalOverlay.classList.contains('open')){
      if(e.key === 'Escape') closeModal();
      return;
    }
    if(typing) return;
    if(e.key === 'Escape') closePanel();
    if(e.key === 'ArrowLeft') changeMonth(-1);
    if(e.key === 'ArrowRight') changeMonth(1);
    if(e.key.toLowerCase() === 't') goToday();
  });

  renderCalendar();
})();
</script>
</body>
</html>
